[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores. Jenkins usa `-m "not integration"` antes de construir y
# `-m integration` despues de levantar la pila.
markers =
    integration: requiere la API y MongoDB en ejecucion (se salta por defecto en local)
    slow: tarda mas de unos segundos

addopts =
    -ra
    --strict-markers
    --tb=short
    --color=yes

filterwarnings =
    ignore::DeprecationWarning:distributed.*
    ignore::DeprecationWarning:dask.*
