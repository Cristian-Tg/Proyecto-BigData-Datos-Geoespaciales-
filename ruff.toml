# py310 y NO py311, aunque la mayoria de las imagenes usen 3.11.
#
# El proyecto corre DOS versiones de Python:
#   python:3.11-slim  -> dask, api, tests   (3.11.16)
#   imagen de Spark   -> spark, benchmark   (3.10.12)
#
# Con target py311, el autofix de ruff convirtio `timezone.utc` en
# `datetime.UTC`, que solo existe desde 3.11. El resultado fue un
# ImportError en tiempo de EJECUCION dentro de la imagen de Spark, con el
# linter en verde. Hay que apuntar al minimo comun, no a la mayoria.
target-version = "py310"
line-length = 100

exclude = [".git", "__pycache__", ".venv", "data", "notebooks"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # la longitud de linea la controla line-length
    "B008",    # los defaults con llamada son idiomaticos en dataclasses/Flask
    "SIM108",  # el ternario no siempre es mas legible que un if/else
    "UP038",   # isinstance(x, (int, float)) es idiomatico y mas legible que
               # isinstance(x, int | float); la regla esta obsoleta en ruff >=0.9
]

[lint.per-file-ignores]
"tests/*" = ["E402"]
"src/api/app.py" = ["C901"]   # create_app agrupa todas las rutas a proposito

[lint.isort]
known-first-party = ["src"]
